name: Test tap

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  updater:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: |
          ruby -c Casks/komodo-agentic-cli.rb
          ruby -c Casks/knocker-cli.rb
          ruby -c Casks/whisper-stt-gnome-extension.rb
          ruby -c Casks/gseek.rb
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install release packages with Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew update
          # Verify the documented command discovers the public repository.
          brew tap fariszr/tap
          git -C "$(brew --repo fariszr/tap)" remote get-url origin
          brew untap fariszr/tap
          # Install this exact commit after checking public tap discovery.
          brew tap fariszr/tap "$GITHUB_WORKSPACE"
          brew trust fariszr/tap
          brew install --cask komodo-agentic-cli knocker-cli
          km --help
          knocker --help
          brew install --cask whisper-stt-gnome-extension
          extension="$HOME/.local/share/gnome-shell/extensions/whisper-stt@fariszr.com"
          test -f "$extension/extension.js"
          test -f "$extension/src/core/whisperController.js"
          test -f "$extension/schemas/gschemas.compiled"
          python3 -c 'import json, sys; metadata = json.load(open(sys.argv[1])); assert metadata["uuid"] == "whisper-stt@fariszr.com"; assert metadata["shell-version"] == ["49", "50"]' "$extension/metadata.json"
          # Reinstallation exercises Homebrew's directory replacement lifecycle.
          brew reinstall --cask whisper-stt-gnome-extension
          test -f "$extension/schemas/gschemas.compiled"
          brew uninstall --cask whisper-stt-gnome-extension
          test ! -e "$extension"
          brew uninstall --cask komodo-agentic-cli knocker-cli
      - name: Test GSeek native desktop lifecycle
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          GSETTINGS_BACKEND: memory
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          sudo apt-get update
          sudo apt-get install -y libgtk-4-1 libadwaita-1-0 libtracker-sparql-3.0-0 gsettings-desktop-schemas xvfb xauth dbus-x11
          brew install --cask gseek
          gseek --version
          gseek_data="${XDG_DATA_HOME:-$HOME/.local/share}"
          gseek_config="${XDG_CONFIG_HOME:-$HOME/.config}"
          provider=/usr/local/share/gnome-shell/search-providers/io.github.FarisZR.GSeek.ini
          desktop="$gseek_data/applications/io.github.FarisZR.GSeek.desktop"
          activation="$gseek_data/dbus-1/services/io.github.FarisZR.GSeek.Service.service"
          autostart="$gseek_config/autostart/io.github.FarisZR.GSeek.desktop"
          for path in "$provider" "$desktop" "$activation" "$autostart"; do test -f "$path"; done
          printf 'Keep my indexed data\n' > "$gseek_data/gseek/test-preserved-data.txt"
          set +e
          xvfb-run -a dbus-run-session -- timeout 3 gseek > /tmp/gseek-gui.log 2>&1
          gui_status=$?
          set -e
          test "$gui_status" = 124
          if grep -E 'CRITICAL|symbol lookup error' /tmp/gseek-gui.log; then cat /tmp/gseek-gui.log; exit 1; fi
          brew reinstall --cask gseek
          gseek --version
          test -f "$provider"
          brew uninstall --cask gseek
          for path in "$provider" "$desktop" "$activation" "$autostart"; do test ! -e "$path"; done
          test -f "$gseek_data/gseek/test-preserved-data.txt"
