name: Test tap

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  updater:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: |
          for cask in Casks/*.rb; do ruby -c "$cask"; done
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install release packages with Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew update
          # Verify the documented command discovers the public repository.
          brew tap fariszr/tap
          git -C "$(brew --repo fariszr/tap)" remote get-url origin
          brew untap fariszr/tap
          # Install this exact commit after checking public tap discovery.
          brew tap fariszr/tap "$GITHUB_WORKSPACE"
          brew trust fariszr/tap
          brew install --cask komodo-agentic-cli knocker-cli
          km --help
          knocker --help
          brew install --cask whisper-stt-gnome-extension
          extension="$HOME/.local/share/gnome-shell/extensions/whisper-stt@fariszr.com"
          test -f "$extension/extension.js"
          test -f "$extension/src/core/whisperController.js"
          test -f "$extension/schemas/gschemas.compiled"
          python3 -c 'import json, sys; metadata = json.load(open(sys.argv[1])); assert metadata["uuid"] == "whisper-stt@fariszr.com"; assert metadata["shell-version"] == ["49", "50", "51"]' "$extension/metadata.json"
          # Reinstallation exercises Homebrew's directory replacement lifecycle.
          brew reinstall --cask whisper-stt-gnome-extension
          test -f "$extension/schemas/gschemas.compiled"
          brew uninstall --cask whisper-stt-gnome-extension
          test ! -e "$extension"
          brew install --cask knocker-gnome
          extension="$HOME/.local/share/gnome-shell/extensions/Knocker@fariszr.com"
          test -f "$extension/extension.js"
          test -f "$extension/src/knocker/service.js"
          test -f "$extension/schemas/gschemas.compiled"
          python3 -c 'import json, sys; metadata = json.load(open(sys.argv[1])); assert metadata["uuid"] == "Knocker@fariszr.com"; assert metadata["shell-version"] == ["48", "49", "50", "51"]' "$extension/metadata.json"
          brew reinstall --cask knocker-gnome
          test -f "$extension/schemas/gschemas.compiled"
          brew uninstall --cask knocker-gnome
          test ! -e "$extension"
          brew install --cask knocker-gnome@main
          test -f "$extension/schemas/gschemas.compiled"
          python3 -c 'import json, re, sys; metadata = json.load(open(sys.argv[1])); assert re.fullmatch("[0-9a-f]{40}", metadata["build-commit"])' "$extension/metadata.json"
          if brew install --cask knocker-gnome; then
            echo 'Stable and main channels must not coexist'
            exit 1
          fi
          test -f "$extension/schemas/gschemas.compiled"
          brew reinstall --cask knocker-gnome@main
          brew uninstall --cask knocker-gnome@main
          test ! -e "$extension"
          brew install --cask jabra-gnome-integration
          extension="$HOME/.local/share/gnome-shell/extensions/jabra-integration@fariszr.com"
          test -f "$extension/headsetState.js"
          test -f "$extension/indicator.js"
          test -f "$extension/schemas/gschemas.compiled"
          python3 -c 'import json, re, sys; metadata = json.load(open(sys.argv[1])); assert metadata["uuid"] == "jabra-integration@fariszr.com"; assert "51" in metadata["shell-version"]; assert re.fullmatch("[0-9a-f]{40}", metadata["version-name"])' "$extension/metadata.json"
          brew reinstall --cask jabra-gnome-integration
          test -f "$extension/schemas/gschemas.compiled"
          brew uninstall --cask jabra-gnome-integration
          test ! -e "$extension"
          brew uninstall --cask komodo-agentic-cli knocker-cli
